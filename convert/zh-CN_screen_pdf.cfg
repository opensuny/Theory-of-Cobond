lang: zh-CN

#screen.pdf: 用于屏幕阅读的PDF格式，紧凑对称页边距，带导航书签(已支持)。
#print.pdf:  用于印刷的PDF格式，非对称页边距，带目录页和导航书签（开发中）。
#website.html:  用于在线网站托管的网页文档，每篇一个html文档，带左侧目录列表页（开发中）。
#single.html:   单个网页，带左侧导航栏（开发中）。
format: screen.pdf

url: http://localhost/Theory-of-Cobond/convert

chrome: C:\Program Files\Google\Chrome\Application\chrome.exe

title: 共邦论——人类文件新形态：俄乌百年和平架构设计

#默认的分页规则（1：每个md文档后加分页 0：不加分页）
page_break_global: 0

#禁止强制分页的文档（从0开始计算）前言后不分页
page_break_exclude:

#强制分页的文件顺序号
page_break_include: 2

page_break_catalog: 0

preface_pages: 5
catalog_pages: 7

page_num_begin: 6
page_num_offset: 1

paper_size: A4

page_bleed: 0mm

#插入目录页
catalog: 0

#书签去重复时使用
seglen: 6

是否强制每篇从奇数页开始
odd_page_start: 0
